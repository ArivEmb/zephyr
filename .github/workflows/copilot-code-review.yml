name: "Copilot Setup Steps"

# Runner for Copilot code review on this fork (it reads
# copilot-code-review.yml first, then copilot-setup-steps.yml).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml

jobs:
  # The job must be called copilot-setup-steps or Copilot ignores it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Runner ready
        run: echo "Copilot clones the repository itself after these steps."
