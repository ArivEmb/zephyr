CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="PACS notify retry"

# The test grows the ATT MTU itself, after the server has tried to notify
CONFIG_BT_GATT_AUTO_UPDATE_MTU=n

CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_NOTIFIABLE=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_PAC_SNK_LOC_NOTIFIABLE=y

CONFIG_ASSERT=y
