CONFIG_ZTEST=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# The server the tests stand up answers over the loopback interface, so
# they need no driver of their own.
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_L2_ETHERNET=n

CONFIG_TFTP_LIB=y

# The client retransmits and waits on every step; keep a case short
# enough that a hang is a failure rather than a long pass.
CONFIG_TFTPC_REQUEST_TIMEOUT=200
CONFIG_TFTPC_REQUEST_RETRANSMITS=1

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
